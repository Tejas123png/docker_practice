name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    name: Build & Validate Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend Docker Image
        run: |
          docker build \
            --tag docker_practice-backend:test \
            --file ./backend/dockerfile \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --tag docker_practice-frontend:test \
            --file ./frontend/dockerfile \
            ./frontend

      - name: Test Running Stack with Docker Compose
        run: |
          docker compose up -d
          sleep 5
          docker compose ps
          curl -f http://localhost || exit 1
          curl -f http://localhost:5000/api/info || exit 1
          docker compose down
