services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: docker_practice_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: docker_practice_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
